<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">xiaomu / real-jacket</title><desc id="desc">Developer console: web engineering, native experience and agent workflows. Build tools. Make room for life.</desc><defs>
