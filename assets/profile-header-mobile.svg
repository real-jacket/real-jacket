<radialGradient id="halo"><stop stop-color="#7760ed" stop-opacity=".18"/><stop offset="1" stop-color="#7760ed" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b0bfff" stroke-opacity=".045"/></pattern>
</defs>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.orbit { transform-box:fill-box; transform-origin:center; animation:orbit 32s linear infinite; }
.signal { animation:signal 4s ease-in-out infinite; }
.cursor { animation:blink 1.8s steps(2,start) infinite; }
@keyframes orbit { to {transform:rotate(360deg)} }
@keyframes signal { 0%,100% {opacity:.35} 50% {opacity:1} }
@keyframes blink { to {opacity:0} }
@media (prefers-reduced-motion:reduce) { .orbit,.signal,.cursor {animation:none} }
</style>
